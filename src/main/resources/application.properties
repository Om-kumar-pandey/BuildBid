spring.application.name=marketplace-backend

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARACTERS
app.jwt.expiration-ms=86400000

# Brevo Email API Configuration
brevo.api-key=${BREVO_API_KEY:}
brevo.template-id=${BREVO_TEMPLATE_ID:1}
brevo.sender.email=${BREVO_SENDER_EMAIL:omkumarpandey4145@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:BuildBid}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}