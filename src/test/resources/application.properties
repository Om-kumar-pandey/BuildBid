# Test configuration for BuildBid integration tests
spring.datasource.url=jdbc:h2:mem:buildbid_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
app.jwt.secret=testsecretkeymustbeatleast32characterslongfortests123
app.jwt.expiration-ms=86400000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Outbox test configuration (valid 256-bit test key: 64 hex characters)
app.outbox.encryption-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
app.outbox.active-key-version=1
app.outbox.poll-interval-ms=60000
app.outbox.lease-duration-seconds=30
app.outbox.batch-size=10
